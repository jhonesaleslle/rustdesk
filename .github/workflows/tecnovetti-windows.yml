# .github/workflows/tecnovetti-windows.yml
# Build Windows x64 (flutter) do RustDesk 1.4.6 — somente Windows, sob demanda.
# Baseado no job `build-for-windows-flutter` do flutter-build.yml da tag 1.4.6.
# - Rode 1x com apply_patch=false (build LIMPO, confirma que gera .exe que roda)
# - Depois rode com apply_patch=true (aplica tecnovetti.patch: servidor+key+approve-mode=click)
name: Tecnovetti - Build Windows

on:
  workflow_dispatch:
    inputs:
      apply_patch:
        description: "Aplicar patches Tecnovetti (servidor+key+approve-mode+variante)? Deixe LIGADO p/ builds reais; só desligue p/ um build limpo upstream de teste."
        type: boolean
        default: true
      variant:
        description: "Variante: client (portátil puro), client-installable (igual o client + botão Instalar) ou operator (UI completa)"
        type: choice
        options:
          - client
          - client-installable
          - operator
        default: client
      selfsign_msix:
        description: "Gerar TAMBÉM um MSIX self-signed p/ teste local? (só vale p/ variant=client; o MSIX da Store é sempre o não-assinado)"
        type: boolean
        default: false

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.6"
  UPLOAD_ARTIFACT: "true"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false

  build-windows:
    name: x86_64-pc-windows-msvc
    needs: [generate-bridge, build-topmost]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # >>> Patch base (TODAS as variantes) — server + key + approve-mode + api-server.
      #     api-server vive no base (não mais só no operador): o conn-audit é postado
      #     pela máquina CONTROLADA (alvo), que precisa do api-server p/ reportar quem
      #     acessou. Sem ele, client/installable são cegos na auditoria. <<<
      - name: Apply Tecnovetti base patch (server + key + approve-mode + api-server)
        if: ${{ inputs.apply_patch }}
        shell: bash
        run: |
          git apply -v --directory=libs/hbb_common tecnovetti.patch
          echo "=== confirmar OVERWRITE_SETTINGS (servidor + api-server) ==="
          grep -n "remoto.tecnovetti.cloud\|api-server" libs/hbb_common/src/config.rs

      # >>> Fix de visibilidade de crash (TODAS as variantes): cria o diretório de
      #     log no Windows ANTES do flexi_logger abrir o arquivo. Sem isso, em
      #     máquina limpa (primeiro launch) a pasta não existia, o logger falhava
      #     em silêncio e nenhum erro de startup era gravado — exatamente o
      #     "crash silencioso" visto na certificação da Store. <<<
      - name: Apply Tecnovetti logdir fix patch (Windows crash visibility)
        if: ${{ inputs.apply_patch }}
        shell: bash
        run: |
          git apply -v --directory=libs/hbb_common tecnovetti-fix-logdir-windows.patch
          echo "=== confirmar create_dir_all no log_path (Windows) ==="
          grep -n "create_dir_all" libs/hbb_common/src/config.rs

      # >>> Patch do CLIENTE (incoming-only) — só no variant=client, em cima do base <<<
      - name: Apply Tecnovetti client patch (incoming-only)
        if: ${{ inputs.apply_patch && inputs.variant == 'client' }}
        shell: bash
        run: |
          git apply -v --directory=libs/hbb_common tecnovetti-client.patch
          echo "=== confirmar conn-type=incoming (UI enxuta do cliente) ==="
          grep -n "conn-type" libs/hbb_common/src/config.rs

      # >>> Patch do CLIENT-INSTALLABLE — igual o client (incoming-only) + allow-install=Y
      #     (libera o botão Instalar) + no-background=Y (sem serviço/bandeja no boot; X encerra
      #     tudo — acesso só com a janela aberta) + APP_NAME "TecnoAssistClient" (junto, sem espaço):
      #     o install renomeia o binário copiado p/ {app_name}.exe, então atalho/registro/serviço/
      #     is_installed casam. Espaço quebraria sc create/taskkill.
      #     Só no variant=client-installable, em cima do base. <<<
      - name: Apply Tecnovetti client-installable patch (incoming-only + allow-install + no-background + APP_NAME junto)
        if: ${{ inputs.apply_patch && inputs.variant == 'client-installable' }}
        shell: bash
        run: |
          git apply -v --directory=libs/hbb_common tecnovetti-client-installable.patch
          echo "=== confirmar APP_NAME=TecnoAssistClient + conn-type=incoming + allow-install=Y + no-background=Y ==="
          grep -n "APP_NAME\|conn-type\|allow-install\|no-background" libs/hbb_common/src/config.rs

      # >>> Patch do OPERADOR — só APP_NAME "TecnoAssist" (sem espaço, p/ sc create/taskkill
      #     do serviço). O api-server agora vem do base (todas as variantes reportam auditoria);
      #     este patch NÃO mexe mais em api-server. Só no variant=operator, em cima do base. <<<
      - name: Apply Tecnovetti operator patch (APP_NAME TecnoAssist; api-server vem do base)
        if: ${{ inputs.apply_patch && inputs.variant == 'operator' }}
        shell: bash
        run: |
          git apply -v --directory=libs/hbb_common tecnovetti-operator.patch
          echo "=== confirmar APP_NAME=TecnoAssist + api-server (do base) ==="
          grep -n "APP_NAME\|api-server" libs/hbb_common/src/config.rs

      # >>> GUARDA: garante que a config patchada bate com a variante escolhida.
      #     Sem isto, um run com apply_patch desligado (ou patch que não pegou)
      #     produziria um exe com UI COMPLETA sem avisar. Aqui o build FALHA cedo. <<<
      - name: Verify variant config (fail-fast)
        if: ${{ inputs.apply_patch }}
        shell: bash
        run: |
          cfg=libs/hbb_common/src/config.rs
          echo "=== marcadores em $cfg (variant=${{ inputs.variant }}) ==="
          grep -n "remoto.tecnovetti.cloud\|conn-type\|allow-install\|api-server" "$cfg" || true
          # base (todas): servidor embutido
          grep -q 'remoto.tecnovetti.cloud' "$cfg" || { echo "ERRO: base patch não aplicou (sem servidor Tecnovetti)"; exit 1; }
          # base (todas): api-server embutido — alvo posta o conn-audit; sem isto a auditoria é cega
          grep -q '"api-server".to_owned(), "https://remoto.tecnovetti.cloud".to_owned()' "$cfg" || { echo "ERRO: base patch sem api-server (clientes não reportariam auditoria)"; exit 1; }
          case "${{ inputs.variant }}" in
            client)
              grep -q '"conn-type".to_owned(), "incoming"' "$cfg" || { echo "ERRO: client sem conn-type=incoming (UI NÃO ficaria enxuta)"; exit 1; }
              grep -q '"allow-install"' "$cfg" && { echo "ERRO: client NÃO deveria ter allow-install"; exit 1; } || true
              ;;
            client-installable)
              grep -q '"conn-type".to_owned(), "incoming"' "$cfg" || { echo "ERRO: client-installable sem conn-type=incoming (UI NÃO ficaria enxuta)"; exit 1; }
              grep -q '"allow-install".to_owned(), "Y"' "$cfg" || { echo "ERRO: client-installable sem allow-install=Y (botão Instalar não apareceria)"; exit 1; }
              grep -q '"no-background".to_owned(), "Y"' "$cfg" || { echo "ERRO: client-installable sem no-background=Y (X não encerraria + serviço de fundo voltaria)"; exit 1; }
              # Variante instalável: APP_NAME PRECISA ser "TecnoAssistClient" (junto, SEM espaço).
              # O install renomeia o binário copiado p/ {app_name}.exe (tecnoassistclient.exe), então
              # atalho/registro/serviço/is_installed casam. Espaço quebraria sc create/taskkill (sem
              # aspas) e o nome do exe.
              grep -q 'APP_NAME: RwLock<String> = RwLock::new("TecnoAssistClient".to_owned())' "$cfg" || { echo "ERRO: client-installable com APP_NAME != \"TecnoAssistClient\" (junto). Espaço quebra atalho/serviço/detecção de instalado"; exit 1; }
              grep -q 'APP_NAME.*"TecnoAssist Client"' "$cfg" && { echo "ERRO: APP_NAME com ESPAÇO na installable (quebra install)"; exit 1; } || true
              ;;
            operator)
              # api-server já é garantido pela checagem base acima (forma estrita). Aqui só
              # confirmamos que o operador NÃO é incoming-only. Usar a forma ESTRITA do
              # HARD_SETTING: o config.rs pristine tem `.get("conn-type")` em is_incoming_only(),
              # então um grep solto por '"conn-type"' daria falso-positivo e falharia o build.
              grep -q '"conn-type".to_owned(), "incoming"' "$cfg" && { echo "ERRO: operator NÃO deveria ser incoming-only"; exit 1; } || true
              grep -q 'APP_NAME: RwLock<String> = RwLock::new("TecnoAssist".to_owned())' "$cfg" || { echo "ERRO: operator com APP_NAME != \"TecnoAssist\" (espaço quebra sc create/taskkill do serviço)"; exit 1; }
              ;;
          esac
          echo "OK: config bate com a variante ${{ inputs.variant }}"

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      # ===== MSIX p/ Microsoft Store — SÓ variant=client =====
      # A Store assina e hospeda de graça (resolve o certificado). O client é
      # incoming-only/sem serviço → cabe no container MSIX (que proíbe serviço).
      # Empacota a pasta ./rustdesk já completa (exe + dlls + topmost). NÃO assina
      # (a Microsoft assina ao publicar). Não toca client-installable nem operator.
      - name: Set up Python for MSIX assets
        if: ${{ inputs.variant == 'client' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow (MSIX assets)
        if: ${{ inputs.variant == 'client' }}
        run: pip install Pillow

      - name: Build MSIX (unsigned, p/ a Store)
        if: ${{ inputs.variant == 'client' }}
        shell: pwsh
        run: |
          ./msix/build_msix.ps1 `
            -Layout (Resolve-Path ./rustdesk) `
            -Manifest ./msix/Package.appxmanifest `
            -AssetsScript ./msix/gen_msix_assets.py `
            -SourceLogo ./res/icon.png `
            -OutMsix (Join-Path $PWD "SignOutput/TecnoAssist-${{ env.VERSION }}-client-store-unsigned.msix")

      - name: Build MSIX (self-signed, p/ teste local)
        if: ${{ inputs.variant == 'client' && inputs.selfsign_msix }}
        shell: pwsh
        run: |
          ./msix/build_msix.ps1 `
            -Layout (Resolve-Path ./rustdesk) `
            -Manifest ./msix/Package.appxmanifest `
            -AssetsScript ./msix/gen_msix_assets.py `
            -SourceLogo ./res/icon.png `
            -OutMsix (Join-Path $PWD "SignOutput/TecnoAssist-${{ env.VERSION }}-client-selfsigned-TEST.msix") `
            -SelfSign

      - name: Upload MSIX
        if: ${{ inputs.variant == 'client' }}
        uses: actions/upload-artifact@master
        with:
          name: tecnoassist-client-msix
          path: |
            ./SignOutput/*.msix
            ./SignOutput/*.cer

      # Artefato 1: a pasta ./rustdesk (tecnoassist.exe roda direto — bom p/ confirmar)
      - name: Upload unsigned folder
        uses: actions/upload-artifact@master
        with:
          name: tecnoassist-${{ inputs.variant }}-unsigned-windows-x86_64
          path: rustdesk

      # Artefato 2: o .exe portátil único (o que você distribui)
      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/tecnoassist.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/TecnoAssist-${{ env.VERSION }}-${{ inputs.variant }}-x86_64.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@master
        with:
          name: tecnoassist-${{ inputs.variant }}-portable-windows-x86_64
          path: ./SignOutput/TecnoAssist-${{ env.VERSION }}-${{ inputs.variant }}-x86_64.exe
